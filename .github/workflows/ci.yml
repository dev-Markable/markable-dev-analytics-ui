name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Отменяем старый прогон при пуше нового коммита в ту же ветку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # read:packages нужен для установки @devpulse-dev/api-types из GitHub Packages.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # .npmrc берёт токен из env GITHUB_TOKEN. Дефолтный workflow-токен видит
        # пакеты той же org (devpulse-dev). Если пакет в чужой org или нужен
        # расширенный доступ — заведи secret OAS_READ_TOKEN (PAT с read:packages)
        # и подставь его вместо secrets.GITHUB_TOKEN.
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.OAS_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
